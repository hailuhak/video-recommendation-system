<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ video.title }} - VideoRec</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #e0f2fe,
                    #f5f3ff
                );

            color: #172033;
        }

        .navbar {
            height: 72px;

            display: flex;
            align-items: center;

            padding: 0 40px;

            background: rgba(255, 255, 255, 0.85);

            backdrop-filter: blur(12px);

            border-bottom: 1px solid #ffffff;

            box-shadow:
                0 4px 20px rgba(79, 70, 229, 0.08);
        }

        .logo {
            text-decoration: none;

            display: flex;
            align-items: center;

            gap: 10px;

            color: #172033;

            font-size: 23px;
            font-weight: 700;
        }

        .logo-icon {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 38px;
            height: 38px;

            border-radius: 10px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );
        }

        .container {
            max-width: 1100px;

            margin: 0 auto;

            padding: 40px 25px;
        }

        .player {
            width: 100%;

            aspect-ratio: 16 / 9;

            border: none;

            border-radius: 16px;

            box-shadow:
                0 15px 40px
                rgba(79, 70, 229, 0.15);
        }

        .video-info {
            margin-top: 25px;

            padding: 25px;

            background: rgba(255, 255, 255, 0.9);

            border-radius: 16px;

            box-shadow:
                0 8px 30px
                rgba(79, 70, 229, 0.08);
        }

        .video-title {
            font-size: 28px;

            line-height: 1.4;

            margin-bottom: 12px;
        }

        .channel {
            color: #6366f1;

            font-weight: 600;

            margin-bottom: 8px;
        }

        .published {
            color: #94a3b8;

            font-size: 14px;
        }

        .recommendations {
            margin-top: 45px;
        }

        .recommendations h2 {
            font-size: 24px;

            margin-bottom: 20px;
        }
        .recommendation-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(260px, 1fr));

    gap: 22px;
}

.recommendation-card {
    overflow: hidden;

    display: block;

    text-decoration: none;

    color: inherit;

    background: rgba(255, 255, 255, 0.9);

    border-radius: 14px;

    box-shadow:
        0 8px 25px rgba(79, 70, 229, 0.08);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

.recommendation-card:hover {
    transform: translateY(-5px);

    box-shadow:
        0 14px 30px rgba(79, 70, 229, 0.16);
}

.recommendation-card img {
    display: block;

    width: 100%;

    aspect-ratio: 16 / 9;

    object-fit: cover;
}

.recommendation-info {
    padding: 15px;
}

.recommendation-info h3 {
    font-size: 16px;

    line-height: 1.4;

    margin-bottom: 8px;

    color: #172033;
}

.recommendation-info p {
    color: #6366f1;

    font-size: 13px;

    font-weight: 600;
}
.video-details {
    margin-top: 24px;
    margin-bottom: 45px;
}

.video-details h1 {
    font-size: 28px;
    line-height: 1.35;
    color: #172033;
    margin-bottom: 14px;
}

.video-meta {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
}

.video-meta .channel {
    color: #6366f1;
    font-size: 15px;
    font-weight: 600;
}

.video-meta .published {
    color: #94a3b8;
    font-size: 14px;
}
.video-player {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: 18px;
    background: #000;
    box-shadow:
        0 15px 40px rgba(79, 70, 229, 0.15);
}

.video-player iframe {
    width: 100%;
    height: 100%;
    display: block;
    border: none;
}
.recommendations {
    margin-top: 20px;
}

.recommendation-header {
    margin-bottom: 22px;
}

.recommendation-header h2 {
    color: #172033;
    font-size: 24px;
    margin-bottom: 6px;
}

.recommendation-header p {
    color: #64748b;
    font-size: 14px;
}.back-button {
    display: inline-block;
    margin-bottom: 18px;
    color: #6366f1;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: color 0.2s ease;
}

.back-button:hover {
    color: #4338ca;
}
    </style>

</head>


<body>

    <nav class="navbar">

        <a href="/" class="logo">

            <span class="logo-icon">
                ▶
            </span>

            <span>
                VideoRec
            </span>

        </a>

    </nav>


    <main class="container">
<a href="/" class="back-button">
    ← Back to videos
</a>
       <div class="video-player">

    <iframe
        src="https://www.youtube.com/embed/{{ video.video_id }}"
        title="{{ video.title }}"
        allowfullscreen
    ></iframe>

</div>


      <div class="video-details">

    <h1>
        {{ video.title }}
    </h1>

    <div class="video-meta">

        <span class="channel">
            {{ video.channel }}
        </span>

        <span class="published">
            Published {{ video.published_at[:10] }}
        </span>

    </div>

</div>


  <section class="recommendations">

    <div class="recommendation-header">

        <h2>
            Recommended for you
        </h2>

        <p>
            Videos similar to what you're watching
        </p>

    </div>

    <div class="recommendation-grid">

        {% for recommendation in recommendations %}

        <a
            href="/video/{{ recommendation.video_id }}"
            class="recommendation-card"
        >

            <img
                src="{{ recommendation.thumbnail }}"
                alt="{{ recommendation.title }}"
            >

            <div class="recommendation-info">

                <h3>
                    {{ recommendation.title }}
                </h3>

                <p>
                    {{ recommendation.channel }}
                </p>

            </div>

        </a>

        {% endfor %}

    </div>

</section>

    </main>

</body>

</html>
