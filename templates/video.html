<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ video.title }} | VideoRec</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff 0%,
                    #e0f2fe 45%,
                    #f5f3ff 100%
                );

            color: #172033;
        }


        /* =========================
           Navigation
        ========================= */

        .navbar {
            height: 72px;

            display: flex;
            align-items: center;

            padding: 0 40px;

            background:
                rgba(255, 255, 255, 0.85);

            backdrop-filter: blur(12px);

            border-bottom:
                1px solid rgba(255, 255, 255, 0.7);

            box-shadow:
                0 4px 20px rgba(79, 70, 229, 0.08);

            position: sticky;
            top: 0;
            z-index: 100;
        }


        .logo {
            display: flex;
            align-items: center;

            gap: 10px;

            color: #172033;

            text-decoration: none;

            font-size: 23px;
            font-weight: 700;
        }


        .logo-icon {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 38px;
            height: 38px;

            border-radius: 10px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            font-size: 17px;

            box-shadow:
                0 6px 15px rgba(99, 102, 241, 0.3);
        }


        /* =========================
           Main container
        ========================= */

        .container {
            max-width: 1200px;

            margin: 0 auto;

            padding: 40px;
        }


        /* =========================
           Back button
        ========================= */

        .back-button {
            display: inline-block;

            margin-bottom: 18px;

            color: #6366f1;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

            transition:
                color 0.2s ease;
        }


        .back-button:hover {
            color: #4338ca;
        }


        /* =========================
           Video player
        ========================= */

        .video-player {
            width: 100%;

            max-width: 1100px;

            margin: 0 auto;

            aspect-ratio: 16 / 9;

            overflow: hidden;

            border-radius: 18px;

            background: #000;

            box-shadow:
                0 15px 40px rgba(79, 70, 229, 0.15);
        }


        .video-player iframe {
            width: 100%;
            height: 100%;

            display: block;

            border: none;
        }


        /* =========================
           Video details
        ========================= */

        .video-details {
            margin-top: 24px;

            margin-bottom: 20px;
        }


        .watching-label {
            margin-bottom: 8px;

            color: #6366f1;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 1.2px;
        }


        .video-details h1 {
            font-size: 28px;

            line-height: 1.35;

            color: #172033;

            margin-bottom: 14px;
        }


        .video-meta {
            display: flex;

            align-items: center;

            gap: 18px;

            flex-wrap: wrap;
        }


        .video-meta .channel {
            color: #6366f1;

            font-size: 15px;

            font-weight: 600;
        }


        .video-meta .published {
            color: #94a3b8;

            font-size: 14px;
        }


        /* =========================
           Like button
        ========================= */

        .like-container {
            display: flex;

            align-items: center;

            margin-bottom: 45px;
        }


        .like-button {
            border: none;

            padding: 11px 20px;

            border-radius: 10px;

            background: #ffffff;

            color: #475569;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 5px 18px rgba(79, 70, 229, 0.10);

            border:
                1px solid rgba(99, 102, 241, 0.12);

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .like-button:hover {
            background: #eef2ff;

            color: #4f46e5;

            transform: translateY(-2px);

            box-shadow:
                0 8px 22px rgba(79, 70, 229, 0.15);
        }


        .like-button:active {
            transform: translateY(0);
        }


        .like-button.liked {
            background: #6366f1;

            color: white;

            border-color: #6366f1;

            cursor: default;

            box-shadow:
                0 6px 18px rgba(99, 102, 241, 0.25);
        }


        .like-button:disabled {
            cursor: default;
        }


        /* =========================
           Recommendations
        ========================= */

        .recommendations {
            margin-top: 20px;
        }


        .recommendation-header {
            margin-bottom: 30px;
        }


        .recommendation-header h2 {
            color: #172033;

            font-size: 24px;

            margin-bottom: 6px;
        }


        .recommendation-header p {
            color: #64748b;

            font-size: 14px;
        }


        .recommendation-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(260px, 1fr)
                );

            gap: 22px;
        }


        .recommendation-card {
            overflow: hidden;

            display: block;

            text-decoration: none;

            color: inherit;

            background:
                rgba(255, 255, 255, 0.9);

            border:
                1px solid rgba(255, 255, 255, 0.8);

            border-radius: 14px;

            box-shadow:
                0 8px 25px rgba(79, 70, 229, 0.08);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .recommendation-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 14px 30px rgba(79, 70, 229, 0.16);
        }


        .recommendation-card img {
            display: block;

            width: 100%;

            aspect-ratio: 16 / 9;

            object-fit: cover;
        }


        .recommendation-info {
            padding: 15px;
        }


        .recommendation-info h3 {
            font-size: 16px;

            line-height: 1.4;

            margin-bottom: 8px;

            color: #172033;
        }


        .recommendation-info p {
            color: #6366f1;

            font-size: 13px;

            font-weight: 600;
        }


        /* =========================
           Responsive
        ========================= */

        @media (max-width: 800px) {

            .navbar {
                padding: 0 20px;
            }


            .container {
                padding: 30px 20px;
            }


            .video-details h1 {
                font-size: 24px;
            }
        }


        @media (max-width: 600px) {

            .navbar {
                height: 64px;

                padding: 0 15px;
            }


            .logo {
                font-size: 20px;
            }


            .logo-icon {
                width: 34px;
                height: 34px;
            }


            .container {
                padding: 25px 15px;
            }


            .video-player {
                border-radius: 12px;
            }


            .video-details {
                margin-bottom: 15px;
            }


            .video-details h1 {
                font-size: 21px;
            }


            .like-container {
                margin-bottom: 35px;
            }


            .recommendation-grid {
                grid-template-columns: 1fr;

                gap: 18px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         Navigation
    ========================= -->

    <nav class="navbar">

        <a
            href="/"
            class="logo"
        >

            <span class="logo-icon">
                ▶
            </span>

            <span>
                VideoRec
            </span>

        </a>

    </nav>


    <!-- =========================
         Main content
    ========================= -->

    <main class="container">


        <!-- Back navigation -->

        <a
            href="/"
            class="back-button"
        >
            ← Back to videos
        </a>


        <!-- =========================
             YouTube player
        ========================= -->

        <div class="video-player">

            <iframe
                src="https://www.youtube.com/embed/{{ video.video_id }}"
                title="{{ video.title }}"
                allowfullscreen
            ></iframe>

        </div>


        <!-- =========================
             Video information
        ========================= -->

        <div class="video-details">

            <p class="watching-label">
                NOW WATCHING
            </p>


            <h1>
                {{ video.title }}
            </h1>


            <div class="video-meta">

                <span class="channel">
                    {{ video.channel }}
                </span>


                <span class="published">
                    Published {{ video.published_at[:10] }}
                </span>

            </div>

        </div>


        <!-- =========================
             Like button
        ========================= -->

        <div class="like-container">

            <button
                id="like-button"
                class="like-button"
                type="button"
            >
                ❤️ Like
            </button>

        </div>


        <!-- =========================
             Recommendations
        ========================= -->

        <section class="recommendations">

            <div class="recommendation-header">

                <h2>
                    Recommended for you
                </h2>


                <p>
                    Videos similar to what you're watching
                </p>

            </div>


            <div class="recommendation-grid">

                {% for recommendation in recommendations %}

                    <a
                        href="/video/{{ recommendation.video_id }}"
                        class="recommendation-card"
                    >

                        <img
                            src="{{ recommendation.thumbnail }}"
                            alt="{{ recommendation.title }}"
                        >


                        <div class="recommendation-info">

                            <h3>
                                {{ recommendation.title }}
                            </h3>


                            <p>
                                {{ recommendation.channel }}
                            </p>

                        </div>

                    </a>

                {% endfor %}

            </div>

        </section>


    </main>


    <!-- =========================
         Like button JavaScript
    ========================= -->

    <script>

        const likeButton =
            document.getElementById(
                "like-button"
            );


        likeButton.addEventListener(
            "click",
            async () => {

                try {

                    likeButton.disabled = true;

                    const response =
                        await fetch(
                            "/video/{{ video.video_id }}/like",
                            {
                                method: "POST",
                            }
                        );


                    if (!response.ok) {

                        throw new Error(
                            "Failed to like video"
                        );

                    }


                    likeButton.textContent =
                        "❤️ Liked";

                    likeButton.classList.add(
                        "liked"
                    );


                } catch (error) {

                    console.error(
                        error
                    );


                    likeButton.disabled = false;

                    likeButton.textContent =
                        "❌ Try Again";

                }

            }
        );

    </script>


</body>

</html>
