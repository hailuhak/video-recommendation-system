<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YouTube Videos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .videos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }

        .video-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
            border-radius: 8px;
        }

        h2 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        p {
            color: #666;
        }
    </style>
</head>

<body>

    <h1>My YouTube Videos</h1>

    <div class="videos">

        {% for video in videos %}

        <div class="video-card">

            <iframe
                src="https://www.youtube.com/embed/{{ video.video_id }}"
                title="{{ video.title }}"
                allowfullscreen>
            </iframe>

            <h2>{{ video.title }}</h2>

            <p>{{ video.channel }}</p>

        </div>

        {% endfor %}

    </div>

</body>
</html>
